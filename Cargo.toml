[package]
name = "x806-konfig"
version = "0.1.0"
edition = "2021"
description = "Konfigurationswerkzeug für das K806/X806-Tastenfeld (VID 0x30FA, PID 0x1340)"
license = "MIT"

[lib]
name = "x806_konfig"
path = "src/lib.rs"

[[bin]]
name = "x806"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
hidapi = "2.6"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
